# CI — DocFlow (Security Review 2.1 ระยะที่ 4: เกราะไม่ให้เกิดซ้ำ)
# ทุก push/PR: syntax check + unit tests + secret-scan (กัน commit ไฟล์ความลับ/backup อีก) + npm audit
name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax + unit tests + secret-scan
        run: npm test
      - name: npm audit (fail เมื่อ high/critical)
        run: npm audit --audit-level=high

  integrate-db:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL แล้วรัน migrate (ตรวจ schema.sql + โครงสร้าง DB จริง)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci-pw -e POSTGRES_DB=docflow -e POSTGRES_USER=postgres -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -q && break; sleep 2; done
          npm ci
          TOKEN_SECRET="$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")" \
          PGPASSWORD=ci-pw PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=docflow \
          node -e "const {pool,migrate,withCtx}=require('./src/db');const {initSecret}=require('./src/platform');migrate().then(()=>withCtx(c=>initSecret(c))).then(()=>{console.log('migrate+initSecret OK');return pool.end()}).catch(e=>{console.error(e);process.exit(1)})"
